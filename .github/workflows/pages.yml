name: Installer domain
on:
  push:
    branches: [main]
    paths: [install.sh, pages/**, tests/**, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: sh -n install.sh && python3 -m unittest discover -s tests -v
      - uses: actions/configure-pages@v5
      - name: Package only the public installer and redirect page
        run: |
          mkdir _site
          cp install.sh _site/install.sh
          cp pages/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
